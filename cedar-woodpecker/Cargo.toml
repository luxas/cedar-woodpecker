[package]
name = "cedar-woodpecker"
edition.workspace = true
rust-version.workspace = true
version = "0.1.0"
license.workspace = true
categories.workspace = true
description = "Woodpecker: synthesizes the implied Cedar policies of privilege-escalation paths"
keywords.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
cedar-policy = { path = "../cedar-policy", version = "=4.12.0", features = ["tpe"] }
cedar-policy-core = { path = "../cedar-policy-core", version = "=4.12.0" }
cedar-policy-symcc = { path = "../cedar-policy-symcc", version = "=0.6.0" }
clap = { version = "4", features = ["derive", "env"] }
miette = { version = "7.6.0", features = ["fancy"] }
nonempty-collections = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol_str = "0.3"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }

[[bin]]
name = "cedar-woodpecker"
path = "src/main.rs"

[lints]
workspace = true
